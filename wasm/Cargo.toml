[package]
name = "buildscope-wasm"
description = "WebAssembly build of the buildscope analysis core"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
buildscope-core = { path = "../core" }
serde_json = "1"

# Profiles live at the workspace root: cargo ignores a member's own
# [profile.*] and warns about it on every invocation, including the ones
# Buildroot's cargo infrastructure makes.
