# Prebuilt CLI binaries, so a consumer downloads one instead of building it.
#
# The firmware CI runs buildscope once per camera across a large matrix; having
# each job build it would mean a Rust toolchain download and a compile in every
# one of them. A release asset turns that into a curl.
#
# Static musl, and built natively on each architecture rather than cross-linked:
# the binary then runs on any glibc, inside a build container or on the runner,
# and the only thing that has to match is the machine.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to attach binaries to"
        required: true

permissions:
  contents: write

jobs:
  # A tag push creates a tag, not a release, and `gh release upload` needs one
  # to exist. Done once here rather than in the matrix, where two jobs would
  # race to create the same release.
  create:
    runs-on: ubuntu-26.04
    steps:
      - name: Ensure the release exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
          else
            gh release create "$TAG" --repo "${{ github.repository }}" \
              --title "$TAG" --generate-notes
          fi

  binaries:
    needs: create
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runs-on: ubuntu-26.04
          - target: aarch64-unknown-linux-musl
            runs-on: ubuntu-26.04-arm
    runs-on: ${{ matrix.runs-on }}
    steps:
      # The tag being released, not the ref this was dispatched from: a
      # workflow_dispatch run would otherwise build whatever main happens to be
      # and attach it to an older tag.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - name: Build ${{ matrix.target }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools
          rustup target add ${{ matrix.target }}
          cargo build --release -p buildscope --target ${{ matrix.target }}

      - name: Check it is static, and runs
        run: |
          BIN=target/${{ matrix.target }}/release/buildscope
          file "$BIN"
          # Ask the question that matters -- does it need a loader? -- rather
          # than matching file(1)'s wording, which says "statically linked" for
          # one of these targets and "static-pie linked" for the other.
          if readelf -l "$BIN" | grep -q "Requesting program interpreter"; then
            echo "dynamically linked; it would not run in the build container"
            exit 1
          fi
          # Native build, so this runner can execute what it just produced.
          "$BIN" --version

      - name: Stage assets
        run: |
          cp target/${{ matrix.target }}/release/buildscope buildscope-${{ matrix.target }}
          sha256sum buildscope-${{ matrix.target }} > buildscope-${{ matrix.target }}.sha256sum
          ls -la buildscope-${{ matrix.target }}*

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          gh release upload "$TAG" \
            "buildscope-${{ matrix.target }}" \
            "buildscope-${{ matrix.target }}.sha256sum" --clobber
