[package]
name = "buildscope"
description = "Size and composition analyzer for Buildroot output trees"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "../README.md"
keywords = ["buildroot", "firmware", "embedded", "size", "cli"]
categories = ["command-line-utilities", "development-tools::profiling", "embedded"]

[[bin]]
name = "buildscope"
path = "src/main.rs"

[dependencies]
buildscope-core = { path = "../core" }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
# For the gzip half of a fleet snapshot's tarball. Same version the core
# already pulls in for decompression, so it costs no extra build.
miniz_oxide = "0.8"
