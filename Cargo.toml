[workspace]
resolver = "2"
members = ["core", "cli", "wasm"]

[workspace.package]
version = "0.1.8"
edition = "2021"
license = "MIT"
repository = "https://github.com/thingino/buildscope"
# u64::is_multiple_of, which the parsers use, stabilised here.
rust-version = "1.87"

[profile.release]
lto = true
strip = true
opt-level = "z"
codegen-units = 1
